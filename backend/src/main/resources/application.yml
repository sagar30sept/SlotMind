spring:
  config:
    import: optional:file:./config/application-local.yml
  datasource:
    url: jdbc:h2:file:./data/slotmind;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: never
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: DEBUG
    com.slotmind: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"

slotmind:
  scheduling:
    strategy: ai
  llm:
    provider: gemini
    model: gemini-3.5-flash
    api-key: ${SLOTMIND_LLM_API_KEY:}
  worker:
    poll-ms: 1000
    initial-delay-ms: 1000
    lease-seconds: 30
    batch-size: 10
